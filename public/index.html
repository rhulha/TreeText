<!DOCTYPE html>
<html lang="en">
<head>
  <title>TreeText</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="bootstrap.min.css"> <!-- 3.3.7 -->
  <link rel="stylesheet" href="jstree.style.css">
  <link rel="stylesheet" href="style.css">
  <script src="jquery-3.3.1.min.js"></script>
  <script src="bootstrap.min.js"></script>
  <script src="split.js"></script>
  <script src="jstree.js"></script>
</head>
<body>

  <a id="logoutButton" href="https://auth.hulha.net/logout">Logout</a>

  <!-- XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX MENU XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX -->
  <div id="menubar">
    <button type="button" id="importButton" class="menu-btn">Import JSON</button>
    <button type="button" id="exportButton" class="menu-btn">Export JSON</button>
    <button type="button" id="deleteCompletedButton" class="menu-btn">Delete Completed</button>
    <button type="button" id="aboutButton" class="menu-btn">About</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <span id="menuStatus"></span>
  </div>

  <div id="panes">
  <!-- XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX LEFT XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX -->
  <div id="mytree" class="split split-horizontal content">
    <form id="addNewFolderForm">
      <input type="text" id="addNewFolderInput" name="addNewFolderInput" style="width: 100%; height:40px" placeholder="New Folder...">
    </form>
    <div id="jstree_div"></div>
  </div>
  
  <!-- XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX MIDDLE XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX -->
  <div id="mylist" class="split split-horizontal content">
    
    <form id="addNewTodoForm">
      <input type="text" id="addNewTodoInput" name="addNewTodoInput" style="width: 100%; height:40px" placeholder="New Todo...">
    </form>
    <br/>
    <div id="list" class="split">
      
    </div>
    
  </div>
  
  <!-- XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX RIGHT XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX -->
  <div id="mydetails" class="split split-horizontal content">

    <div id="todoDetails">
      <h4 id="detailsTitle">No todo selected</h4>

      <div class="details-section">
        <div class="details-label">Subitems</div>
        <form id="addSubitemForm">
          <input type="text" id="addSubitemInput" placeholder="New subitem...">
        </form>
        <div id="subitemList"></div>
      </div>

      <div class="details-section">
        <div class="details-label">Notes</div>
        <textarea id="todoNotes" placeholder="Notes..."></textarea>
      </div>
    </div>
  </div>
  </div>

  <div id="aboutOverlay">
    <div id="aboutDialog">
      <h4>TreeText</h4>
      <p>A tree based todo list.</p>
      <button type="button" id="aboutCloseButton" class="menu-btn">Close</button>
    </div>
  </div>

  <script>
    Split(['#mytree', '#mylist', '#mydetails'], {
      sizes: [10, 75, 15],
      gutterSize: 8,
      cursor: 'col-resize'
    })
  </script>
  
  <script type="module" src="menu.js"></script>
  <script type="module" src="tree.js"></script>
  <script type="module" src="todo.js"></script>

  </body>
</html>
